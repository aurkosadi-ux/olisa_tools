                    <div class="bg-yellow-300 border-2 border-yellow-400 p-3 rounded-xl shadow-md text-xl font-extrabold text-gray-900 text-center" id="price_output" data-price="0.0000">$0.0000</div>

        <!-- --- END STATIC TOP SECTION --- -->

        <main class="relative">

                <!-- Square Meter Output (NOT FIXED - UN-FROZEN) -->

                </div>
                
                <!-- Unit Selector & Rate -->
                <div class="grid grid-cols-3 gap-3">
                    <!-- Unit Selector -->
                    <div class="col-span-1">

                            <select id="unit" onchange="App.updateUnits(); App.calculatePrice();" class="w-full p-2.5 rounded-lg border border-gray-300 bg-white text-sm focus:border-indigo-600 focus:ring-indigo-600 appearance-none">

                <!-- Box Dimensions Input -->
                <h3 class="text-sm font-semibold text-gray-700 mt-4 mb-2" id="dimensions_label">Carton Measurements (CM)</h3>
                <div id="dimensionInputs" class="grid grid-cols-3 gap-3">
                    <div class="flex flex-col mb-2">
                        <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Length (L)</label>
                        <input type="number" min="0" id="lengthInput" value="" placeholder="0.00" oninput="App.calculatePrice()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">

                    <div class="flex flex-col mb-2">

                            <input type="text" id="lengthCmOutput" readonly class="w-full p-2.5 rounded-lg border text-sm bg-gray-100 text-gray-800 border-gray-200 font-semibold">

                            <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Wastage Width (WW)</label>
                            <input type="number" min="0" id="wastageWidth" value="6" oninput="App.calculatePrice()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                        </div>
                        <div class="flex flex-col mb-2">
                            <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Wastage Height (WH)</label>
                            <input type="number" min="0" id="wastageHeight" value="4" oninput="App.calculatePrice()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">

                    <!-- Rows will be injected here -->

                </button>

                <button onclick="App.copyMultipleQuotes()" id="copyMultipleButton" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200 shadow-lg mb-4">
                    Copy

                <span id="formula_note">*Formula is calculated based on <strong>Master Carton</strong> specifications.</span>
                <p class="mt-2 text-gray-400">Courtesy of Sadi Mohammad</p>
            </div>

        </main>
    </div>
</div>

<script>
    const CM_PER_INCH = 2.54;

    // --- Helper Functions ---
    const getVal = (id) => parseFloat(document.getElementById(id).value) || 0;

    // A blank or negative box reads as 0 through getVal, and 0 flows all the way into a copied quote
    // as "$0.0000 / pcs." — a real-looking price, sent to a customer, for a carton nobody measured.
    // Live typing still shows 0.0000, because you have to be able to type "7" before "71.5". But a
    // quote is only allowed OUT of the calculator once every number behind it is a real one.
    function badNumbers(vals) {
        const bad = [];
        for (const label in vals) {
            const n = Number(vals[label]);
            if (!Number.isFinite(n) || n <= 0) bad.push(label);
        }
        return bad;
    }
    function refuseQuote(bad) {
        // Reuses the existing "Quote Copied!" line under the price, in red. It is already positioned
        // and already fades, so the refusal appears exactly where the confirmation would have.
        const el = document.getElementById('copyMessage');
        const msg = 'Nothing copied \u2014 ' + bad.join(', ') + ' must be greater than zero.';
        if (el) {
            el.textContent = msg;
            el.classList.remove('text-emerald-600');
            el.classList.add('text-red-600');
            el.style.opacity = '1';
            setTimeout(() => {
                el.style.opacity = '0';
                el.classList.remove('text-red-600');
                el.classList.add('text-emerald-600');
            }, 4500);
        } else { alert(msg); }
    }
    const formatSqm = (value) => value.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    const formatCurrency = (value) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 4, maximumFractionDigits: 4 }).format(value);
    const formatRawPrice = (value) => parseFloat(value).toFixed(4);

    // --- Core Calculation Function ---
    function calculateArea(itemName, L_cm, W_cm, H_cm, wastageWidth = 0, wastageHeight = 0) {
        let areaCm2 = 0;

        if (itemName === 'Master Carton') {
            // Formula: 2 * (l+w+width wastage) * (w+h+height wastage)
            areaCm2 = 2 * (L_cm + W_cm + wastageWidth) * (W_cm + H_cm + wastageHeight);
        } else if (itemName === 'Top/Bottom') {
            // Formula: (length X width). H_cm is ignored.
            areaCm2 = L_cm * W_cm;
        } else if (itemName === 'U-Divider') {
            // Formula: (Length+2) * (Width + (2*Height)+2)
            areaCm2 = (L_cm + 2) * (W_cm + (2 * H_cm) + 2);
        }

        return areaCm2 / 10000; // Convert cm² to m²
    }


    // --- Global App State and Logic ---
    const App = {
        viewMode: 'single', // 'single' or 'multiple'
        rowCount: 0,
        
        /**
         * Switches the view between Single Price and Multiple Prices.
         */
        switchView: function() {
            this.viewMode = (this.viewMode === 'single' ? 'multiple' : 'single');
            document.getElementById('singleView').classList.toggle('hidden', this.viewMode !== 'single');
            document.getElementById('multipleView').classList.toggle('hidden', this.viewMode !== 'multiple');
            document.getElementById('sqmDisplay').classList.toggle('hidden', this.viewMode !== 'single');
            
            // --- NEW: Hide/Show the main price output container based on view ---
            const fixedPriceResult = document.getElementById('fixedPriceResult');
            fixedPriceResult.classList.toggle('hidden', this.viewMode === 'multiple');
            
            // Update button text and class
            const switchBtn = document.getElementById('viewSwitchButton');
            if (this.viewMode === 'single') {
                switchBtn.textContent = 'Multiple Prices';
                switchBtn.classList.add('bg-emerald-500');
                switchBtn.classList.remove('bg-gray-500');
                this.calculatePrice(); // Recalculate single price on return
            } else {
                switchBtn.textContent = 'Single Price';
                switchBtn.classList.remove('bg-emerald-500');
                switchBtn.classList.add('bg-gray-500');
                this.calculateAllMultiPrices(); // Recalculate all multi prices on entry
            }
        },

        // --- SINGLE VIEW LOGIC ---

        /**
         * Core calculation and UI update for the Single Price View.
         */
        calculatePrice: function() {
            const itemName = document.getElementById('itemName').value;
            const unit = document.getElementById('unit').value;
            const ratePerSqm = getVal('ratePerSqm');
            
            let L = getVal('lengthInput');
            let W = getVal('widthInput');
            let H = getVal('heightInput');
            
            const wastageWidth = getVal('wastageWidth');
            const wastageHeight = getVal('wastageHeight');
            
            let lengthCm, widthCm, heightCm;

            // --- UI Toggles for Top/Bottom ---
            const heightContainer = document.getElementById('heightContainer');
            const heightCmContainer = document.getElementById('heightCmContainer');
            const dimensionInputs = document.getElementById('dimensionInputs');
            const dimensionOutputs = document.getElementById('dimensionOutputs');
            
            const isTopBottom = itemName === 'Top/Bottom';
            
            // Hide/Show Height and adjust grid
            heightContainer.classList.toggle('hidden', isTopBottom);
            heightCmContainer.classList.toggle('hidden', isTopBottom);
            
            if (isTopBottom) {
                 // Adjust to 2 columns if only L and W are used
                dimensionInputs.classList.replace('grid-cols-3', 'grid-cols-2');
                dimensionOutputs.classList.replace('grid-cols-3', 'grid-cols-2');
            } else {
                // Reset to 3 columns
                dimensionInputs.classList.replace('grid-cols-2', 'grid-cols-3');
                dimensionOutputs.classList.replace('grid-cols-2', 'grid-cols-3');
            }
            
            // --- Unit Conversion ---
            if (unit === 'INCH') {
                lengthCm = L * CM_PER_INCH;
                widthCm = W * CM_PER_INCH;
                heightCm = H * CM_PER_INCH;
                
                document.getElementById('lengthCmOutput').value = lengthCm.toFixed(2);
                document.getElementById('widthCmOutput').value = widthCm.toFixed(2);
                document.getElementById('heightCmOutput').value = heightCm.toFixed(2);
            } else {
                lengthCm = L;
                widthCm = W;
                heightCm = H;
            }

            // --- Calculation ---
            const calculatedSqm = calculateArea(itemName, lengthCm, widthCm, heightCm, wastageWidth, wastageHeight);
            const pricePerCarton = calculatedSqm * ratePerSqm;

            // --- Update Fixed Header Results (Now Static) ---
            this.updateFixedPriceDisplay(pricePerCarton, itemName);
            
            // --- Update Single View UI Results ---
            document.getElementById('sqm_output').value = formatSqm(calculatedSqm);
            
            // Update labels and visibility
            document.getElementById('formula_note').innerHTML = `*Formula is calculated based on <strong>${itemName}</strong> specifications.`;
            document.getElementById('wastage_section').style.display = (itemName === 'Master Carton' ? 'block' : 'none');
        },

        /**
         * Toggles the unit labels and visibility of calculated CM outputs.
         */
        updateUnits: function() {
            const unit = document.getElementById('unit').value;
            const showInch = unit === 'INCH';
            const unitText = showInch ? 'INCH' : 'CM';

            document.getElementById('dimensions_label').textContent = `Carton Measurements (${unitText})`;
            document.getElementById('cm_calculated_section').classList.toggle('hidden', !showInch);
        },

        // --- MULTIPLE VIEW LOGIC ---

        /**
         * Adds a new row of input fields to the multiple view.
         */
        /** Last rate the user typed, so a new item row starts from it instead of a hard default. */
        lastRate: 0.80,
        rememberRate: function(index) {
            const el = document.getElementById(`multiRate-${index}`);
            if (el && el.value !== '') App.lastRate = parseFloat(el.value) || App.lastRate;
        },

        addRow: function() {
            const index = App.rowCount++;
            const container = document.getElementById('multipleRowsContainer');
            
            const newRow = document.createElement('div');
            newRow.id = `row-${index}`;
            newRow.className = 'p-3 border border-gray-200 rounded-lg mb-3 shadow-sm bg-white';
            
            newRow.innerHTML = `
                <div class="flex justify-between items-center mb-2 pb-1 border-b border-gray-100">
                    <h4 class="text-sm font-bold text-indigo-600">Item #${index + 1}</h4>
                    <button onclick="App.removeRow(${index})" class="text-red-500 hover:text-red-700 text-xs font-semibold">
                        Remove
                    </button>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col mb-2">
                        <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Item Name</label>
                        <select id="multiItemName-${index}" onchange="App.handleMultiItemChange(${index}); App.calculateAllMultiPrices();" class="w-full p-2.5 rounded-lg border border-gray-300 bg-white text-sm focus:border-indigo-600 focus:ring-indigo-600 appearance-none">
                            <option value="Master Carton">Master Carton</option>
                            <option value="Top/Bottom">Top/Bottom</option>
                        </select>
                    </div>

                    <div class="flex flex-col mb-2">
                        <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Price / Pcs</label>
                        <input type="text" id="multiPrice-${index}" value="$0.0000" readonly class="w-full p-2.5 rounded-lg border text-sm bg-gray-100 text-gray-800 border-gray-200 font-semibold text-right">
                    </div>
                </div>

                <!-- Each item carries its own rate, so master cartons and top/bottom can be
                     priced at different rates in the same quote. Defaults to the last rate used. -->
                <div class="flex flex-col mb-2">
                    <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Rate per SQM ($)</label>
                    <input type="number" min="0" id="multiRate-${index}" value="${App.lastRate}" oninput="App.rememberRate(${index}); App.calculateAllMultiPrices();" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                </div>

                <!-- NEW: Separate L, W, H inputs -->
                <h5 class="text-xs font-medium text-gray-700 mt-2 mb-1 leading-tight">Measurements (CM)</h5>
                <div id="multiDimensionInputs-${index}" class="grid grid-cols-3 gap-3">
                    <div class="flex flex-col">
                        <input type="number" min="0" id="multiL-${index}" placeholder="L" oninput="App.calculateAllMultiPrices()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                    </div>
                    <div class="flex flex-col">
                        <input type="number" min="0" id="multiW-${index}" placeholder="W" oninput="App.calculateAllMultiPrices()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                    </div>
                    <div class="flex flex-col" id="multiHContainer-${index}">
                        <input type="number" min="0" id="multiH-${index}" placeholder="H" oninput="App.calculateAllMultiPrices()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                    </div>
                </div>
                
                <div id="multiWastageContainer-${index}" class="grid grid-cols-2 gap-3 mt-4">
                    <div class="flex flex-col mb-2">
                        <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Wastage W (CM)</label>
                        <input type="number" min="0" id="multiWW-${index}" value="6" oninput="App.calculateAllMultiPrices()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                    </div>
                    <div class="flex flex-col mb-2">
                        <label class="text-xs font-medium text-gray-700 mb-1 leading-tight">Wastage H (CM)</label>
                        <input type="number" min="0" id="multiWH-${index}" value="4" oninput="App.calculateAllMultiPrices()" class="w-full p-2.5 rounded-lg border text-sm bg-white border-gray-300 focus:border-indigo-600 focus:ring-indigo-600" step="any">
                    </div>
                </div>
            `;
            
            container.appendChild(newRow);
            this.handleMultiItemChange(index); // Initialize visibility
            this.calculateAllMultiPrices(); // Calculate price for the new row
        },

        /**
         * Removes a row from the multiple view.
         * @param {number} index - The index of the row to remove.
         */
        removeRow: function(index) {
            const row = document.getElementById(`row-${index}`);
            if (row) {
                row.remove();
                this.calculateAllMultiPrices(); // Recalculate prices
            }
        },

        /**
         * Toggles the visibility of wastage and height inputs based on item name.
         * @param {number} index - The index of the row.
         */
        handleMultiItemChange: function(index) {
            const itemName = document.getElementById(`multiItemName-${index}`).value;
            const wastageContainer = document.getElementById(`multiWastageContainer-${index}`);
            const heightContainer = document.getElementById(`multiHContainer-${index}`);

            // Toggle wastage for Master Carton
            wastageContainer.classList.toggle('hidden', itemName !== 'Master Carton');
            
            // Toggle Height for Top/Bottom (Top/Bottom doesn't use H in formula)
            heightContainer.classList.toggle('hidden', itemName === 'Top/Bottom');
        },

        /**
         * Recalculates all prices in the multiple view and updates the main price display 
         * with the price of the *last calculated* item. NO GRAND TOTAL IS CALCULATED.
         */
        calculateAllMultiPrices: function() {
            let lastPrice = 0;
            let lastItemName = 'Carton';

            
            // Get all actual row elements currently in the container
            const container = document.getElementById('multipleRowsContainer');
            const rows = Array.from(container.children);
            
            rows.forEach(rowElement => {
                // Extract the index from the ID, e.g., 'row-5' -> 5, this is the internal ID
                const i = parseInt(rowElement.id.split('-')[1]);
                
                // Get elements using the row index 'i'
                const itemName = document.getElementById(`multiItemName-${i}`).value;
                const priceOutput = document.getElementById(`multiPrice-${i}`);
                
                // Read from separate L, W, H inputs
                let L = parseFloat(document.getElementById(`multiL-${i}`).value) || 0;
                let W = parseFloat(document.getElementById(`multiW-${i}`).value) || 0;
                let H = parseFloat(document.getElementById(`multiH-${i}`).value) || 0;
                
                // Get wastage inputs for Master Carton
                let wastageWidth = 0;
                let wastageHeight = 0;
                if (itemName === 'Master Carton') {
                    wastageWidth = parseFloat(document.getElementById(`multiWW-${i}`).value) || 0;
                    wastageHeight = parseFloat(document.getElementById(`multiWH-${i}`).value) || 0;
                }

                // If Top/Bottom is selected, H should effectively be 0 for the formula
                if (itemName === 'Top/Bottom') {
                    H = 0;
                }
                
                const calculatedSqm = calculateArea(itemName, L, W, H, wastageWidth, wastageHeight);
                const rateEl = document.getElementById(`multiRate-${i}`);
                const rowRate = rateEl ? (parseFloat(rateEl.value) || 0) : App.lastRate;
                const pricePerCarton = calculatedSqm * rowRate;
                
                priceOutput.value = formatCurrency(pricePerCarton);
                priceOutput.setAttribute('data-price', pricePerCarton.toFixed(4));
                
                // Store the last calculated price and name
                lastPrice = pricePerCarton;
                lastItemName = itemName;
            });

            // Update the main price box with the last calculated price (Only visible in single view)
            this.updateFixedPriceDisplay(lastPrice, lastItemName);
        },

        /**
         * Updates the main fixed price box.
         * @param {number} price - The price to display.
         * @param {string} name - The item name for the label.
         */
        updateFixedPriceDisplay: function(price = 0, name = 'Carton') {
            document.getElementById('price_output').setAttribute('data-price', formatRawPrice(price));
            document.getElementById('price_output').textContent = formatCurrency(price);
            document.getElementById('price_label').textContent = `Price per ${name}`;
        },


        // --- SHARED LOGIC ---

        /**
         * Copies the single quote to the clipboard.
         */
        copySingleQuote: function() {
            const itemName = document.getElementById('itemName').value;
            const unit = document.getElementById('unit').value;
            const price = document.getElementById('price_output').getAttribute('data-price') || '0.0000';
            
            let displayL, displayW, displayH;
            
            if (unit === 'INCH') {
                displayL = getVal('lengthCmOutput').toFixed(2);
                displayW = getVal('widthCmOutput').toFixed(2);
                displayH = (itemName === 'Top/Bottom') ? '' : getVal('heightCmOutput').toFixed(2);
            } else {
                displayL = getVal('lengthInput').toFixed(2);
                displayW = getVal('widthInput').toFixed(2);
                displayH = (itemName === 'Top/Bottom') ? '' : getVal('heightInput').toFixed(2);
            }

            let dimensionString;
            if (itemName === 'Top/Bottom') {
                dimensionString = `L${displayL} X W${displayW} CM`;
            } else {
                dimensionString = `L${displayL} X W${displayW} X H${displayH} CM`;
            }
            // Refuse before building the string, not after: once it is on the clipboard it is gone.
            const _need = { Length: displayL, Width: displayW, Rate: price };
            if (itemName !== 'Top/Bottom') _need.Height = displayH;
            const _bad = badNumbers(_need);
            if (_bad.length) return refuseQuote(_bad);


            const quoteString = `${itemName}; ${dimensionString} - $${price} / pcs.`;
            App.copyToClipboard(quoteString, 'Quote Copied!');
        },

        /**
         * Generates and copies a multi-line quote of all rows to the clipboard, with numbering.
         */
        copyMultipleQuotes: function() {
            // Re-run calculation to ensure prices are up-to-date
            this.calculateAllMultiPrices();

            // Use the specified opening phrase
            let quoteString = "Please see the prices below-\n\n";
            let itemQuotes = [];
            const badRows = [];
            
            // Get all actual row elements currently in the container
            const container = document.getElementById('multipleRowsContainer');
            const rows = Array.from(container.children);

            // Gather data and create item quotes
            rows.forEach((rowElement, index) => {
                // Extract the internal index
                const i = parseInt(rowElement.id.split('-')[1]);
                
                // Get elements using the row index 'i'
                const itemName = document.getElementById(`multiItemName-${i}`).value;
                const priceRaw = document.getElementById(`multiPrice-${i}`).getAttribute('data-price');
                const price = formatRawPrice(priceRaw);
                
                // Read dimensions (always in CM for this view)
                const L_raw = parseFloat(document.getElementById(`multiL-${i}`).value) || 0;
                const W_raw = parseFloat(document.getElementById(`multiW-${i}`).value) || 0;
                const H_raw = parseFloat(document.getElementById(`multiH-${i}`).value) || 0;
                
                const L = L_raw.toFixed(2);
                const W = W_raw.toFixed(2);
                
                let dimensionString;
                if (itemName === 'Top/Bottom') {
                    dimensionString = `L${L} X W${W} CM`;
                } else {
                    const H = H_raw.toFixed(2);
                    dimensionString = `L${L} X W${W} X H${H} CM`;
                }
                
                // Same rule as the single quote: a row with a missing or negative measurement is a
                // row nobody priced. It names the item number so you know which one to go back to,
                // rather than refusing the whole list with no clue where the gap is.
                const _need = { Length: L_raw, Width: W_raw, Rate: price };
                if (itemName !== 'Top/Bottom') _need.Height = H_raw;
                const _bad = badNumbers(_need);
                if (_bad.length) { badRows.push(`item ${index + 1} (${_bad.join(', ')})`); return; }

                // Use index + 1 for sequential numbering
                const itemQuote = `${index + 1}. ${itemName}; ${dimensionString} - $${price} / pcs.`;
                itemQuotes.push(itemQuote);
            });
            if (badRows.length) return refuseQuote(badRows);

            // Assemble the final string without a grand total
            quoteString += itemQuotes.join('\n');
            
            // Pass a specific message for the multiple copy action
            App.copyToClipboard(quoteString, 'Multiple Quotes Copied!');
        },

        /**
         * Universal copy function with visual feedback.
         * @param {string} textToCopy - The string content to copy to the clipboard.
         * @param {string} confirmationMessage - The message to show on success.
         */
        copyToClipboard: function(textToCopy, confirmationMessage = 'Copied!') {
            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            tempInput.style.position = 'absolute';
            tempInput.style.left = '-9999px';
            document.body.appendChild(tempInput);

            let success = false;
            // navigator.clipboard is the supported path and the one that behaves on modern Android,
            // where execCommand is increasingly a no-op that still reports success. It needs a secure
            // context, so the old textarea trick stays behind it rather than being thrown away.
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).catch(() => {
                    try { tempInput.select(); document.execCommand('copy'); } catch (e) {}
                });
                success = true;
            } else {
                try {
                    tempInput.select();
                    document.execCommand('copy');
                    success = true;
                } catch (err) {
                    console.error('Copy failed with execCommand fallback:', err);
                    success = false;
                }
            }

            document.body.removeChild(tempInput);

            // Determine which confirmation elements to target based on view mode
            let targetButton, targetMessage;
            if (this.viewMode === 'multiple') {
                targetButton = document.getElementById('copyMultipleButton');
                // For the multiple view, we use the button itself to show feedback
                targetMessage = document.createElement('div');
                targetMessage.className = 'absolute inset-0 flex items-center justify-center text-sm font-bold bg-indigo-700 text-white rounded-lg opacity-0 transition-opacity duration-300 pointer-events-none';
                targetMessage.textContent = success ? confirmationMessage : 'Copy failed.';
                
                if (targetButton) {
                    targetButton.style.position = 'relative';
                    targetButton.appendChild(targetMessage);
                }
                
            } else {
                targetButton = document.getElementById('copyButton'); // The smaller button next to the price
                targetMessage = document.getElementById('copyMessage'); // The dedicated message div below the price
            }


            if (success) {
                if (this.viewMode === 'multiple' && targetMessage) {
                    targetMessage.classList.add('opacity-100');
                    setTimeout(() => {
                        targetMessage.classList.remove('opacity-100');
                        if (targetButton) targetButton.removeChild(targetMessage);
                    }, 2000);
                } else if (targetMessage && targetButton) {
                    targetMessage.textContent = confirmationMessage;
                    targetMessage.classList.add('opacity-100');
                    targetButton.classList.add('copy-button-flash');
                    
                    setTimeout(() => {
                        targetMessage.classList.remove('opacity-100');
                        targetButton.classList.remove('copy-button-flash');
                    }, 2000);
                }
            } else {
                 console.error('Copy failed.');
            }
        },
    };

    // Global function for onclick in HTML (Only used for the small 'Copy Quote' button in Single View)
    function copyQuoteToClipboard() {
        if (App.viewMode === 'single') {
            App.copySingleQuote();
        } 
        // Note: The main "Copy" button in the multiple view calls App.copyMultipleQuotes() directly.
    }

    // --- Initialization ---
    window.onload = function() {
        // Initialize Single View UI elements
        App.updateUnits();
        
        // Ensure default values are visually empty but maintain placeholder
        document.getElementById('lengthInput').value = '';
        document.getElementById('widthInput').value = '';
        document.getElementById('heightInput').value = '';
        document.getElementById('ratePerSqm').value = '0.80';
        document.getElementById('wastageWidth').value = '6';
        document.getElementById('wastageHeight').value = '4';
        
        // Set initial view button text
        document.getElementById('viewSwitchButton').textContent = 'Multiple Prices';
        document.getElementById('viewSwitchButton').classList.add('bg-emerald-500');

        App.calculatePrice(); // Perform initial calculation (will result in 0.0000)
        
        // Add one default row to the Multiple View to start
        App.addRow();
        
        // Set view to 'single' and update UI state.
        document.getElementById('singleView').classList.remove('hidden');
        document.getElementById('multipleView').classList.add('hidden');
        document.getElementById('sqmDisplay').classList.remove('hidden'); // Ensure SQM is visible in single mode
        document.getElementById('fixedPriceResult').classList.remove('hidden'); // Ensure price is visible in single mode
        App.viewMode = 'single'; 
    };

</script>
