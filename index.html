<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102A6E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sadi’s Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --navy: #102A6E; --blue: #1565D8; --gold: #D69620;
    --ink: #0F2540; --sub: #5B6D89; --line: #E5ECF5;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #EAF2FF 0%, #F6F9FE 55%, #FFFFFF 100%);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 18px; min-height: 100%;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.2px; }
  .sub { color: var(--sub); font-size: 13px; margin: 0 0 26px; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 620px; }
  @media (max-width: 520px) { .tiles { grid-template-columns: 1fr; } }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 30px 18px; background: #fff; border: 1px solid var(--line);
    border-radius: 20px; text-decoration: none; color: inherit;
    box-shadow: 0 2px 6px rgba(15,37,64,.04), 0 24px 50px -30px rgba(14,116,233,.28);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px);
    border-color: #C9DDF7;
    box-shadow: 0 6px 14px rgba(15,37,64,.07), 0 30px 60px -28px rgba(14,116,233,.38);
    outline: none;
  }
  .tile img { width: 96px; height: 96px; object-fit: contain; }
  .tile b { font-size: 15.5px; font-weight: 800; }
  .tile span { font-size: 12px; color: var(--sub); text-align: center; }

  /* Slow drifting colour fields behind everything — motion without distraction. */
  body::before, body::after {
    content:''; position:fixed; border-radius:50%; filter:blur(70px); opacity:.5;
    pointer-events:none; z-index:0;
  }
  body::before { width:52vmax; height:52vmax; left:-16vmax; top:-18vmax;
    background:radial-gradient(circle at 30% 30%, #BFD9FF, transparent 62%);
    animation: drift1 26s ease-in-out infinite alternate; }
  body::after { width:46vmax; height:46vmax; right:-14vmax; bottom:-16vmax;
    background:radial-gradient(circle at 60% 60%, #FFE6B8, transparent 62%);
    animation: drift2 32s ease-in-out infinite alternate; }
  @keyframes drift1 { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(7vmax,5vmax,0) scale(1.12); } }
  @keyframes drift2 { from { transform: translate3d(0,0,0) scale(1.08); } to { transform: translate3d(-6vmax,-4vmax,0) scale(1); } }

  h1, .sub, .tiles, footer { position: relative; z-index: 1; }

  /* Entrance: title, subtitle, then each tile in turn. */
  h1 { animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
  .sub { animation: rise .7s cubic-bezier(.2,.7,.3,1) .08s both; }
  .tile { animation: rise .75s cubic-bezier(.2,.7,.3,1) both; }
  .tile:nth-child(1) { animation-delay: .16s; }
  .tile:nth-child(2) { animation-delay: .26s; }
  footer { animation: fade 1s ease .5s both; }
  @keyframes rise { from { opacity:0; transform: translateY(16px) scale(.985); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  /* Logos breathe gently; lifts on hover. */
  .tile img { animation: float 5.5s ease-in-out infinite; transition: transform .3s ease; }
  .tile:nth-child(2) img { animation-delay: -2.6s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .tile:hover img { transform: scale(1.07) translateY(-4px); }

  /* Light sweeps across a tile on hover. */
  .tile { position: relative; overflow: hidden; }
  .tile::after {
    content:''; position:absolute; top:0; left:-70%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
    transform: skewX(-18deg); transition: left .65s ease; pointer-events:none;
  }
  .tile:hover::after { left:130%; }

  /* Anyone who prefers stillness gets stillness. */
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, .tile img { animation: none; }
    h1, .sub, .tile, footer { animation: none; }
    .tile::after { transition: none; }
  }
  footer { margin-top: 30px; font-size: 11.5px; color: var(--sub); text-align: center; }
</style>
</head>
<body>
  <h1>Sadi’s Universe</h1>
  <p class="sub">Pick a tool to open.</p>

  <div class="tiles">
    <a class="tile" href="olisa.html">
      <img src="icon-512.png" alt="Olisa Reporting Tools">
      <b>Olisa Reporting Tools</b>
      <span>Delivery reconciliation, PI lookup, shortage &amp; undelivered reports</span>
    </a>
    <a class="tile" href="calculator.html">
      <img src="calc-icon-512.png" alt="Carton Price Calculator">
      <b>Carton Price Calculator</b>
      <span>Single and multi-item carton pricing by rate per SQM</span>
    </a>
  </div>

  <footer>Courtesy of Sadi Mohammad</footer>
</body>
</html>
