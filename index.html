<title>Sadi’s Universe</title>
<!-- The stylesheet used to BLOCK the first paint: nothing on the page could render until Google
     answered. On a weak factory connection that is a blank screen for as long as the request takes
     to time out. Loading it as media="print" lets the browser render immediately, then onload flips
     it to all and the real fonts swap in. The URL already carries display=swap, so the brief moment
     of fallback type happened before this change too — the only difference is that the page is now
     usable during it. The <noscript> copy keeps fonts working with JavaScript disabled.
     The service worker caches these cache-first, so this only ever costs anything on a first run. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"></noscript>
<style>
  * { box-sizing: border-box; }
  :root {
    --navy: #102A6E; --blue: #1565D8; --gold: #D69620;
    --ink: #0F2540; --sub: #5B6D89; --line: #E5ECF5;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #EAF2FF 0%, #F6F9FE 55%, #FFFFFF 100%);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 18px; min-height: 100%;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.2px; }
  .sub { color: var(--sub); font-size: 13px; margin: 0 0 26px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 860px; }
  @media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 620px; } }
  @media (max-width: 520px) { .tiles { grid-template-columns: 1fr; } }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 30px 18px; background: #fff; border: 1px solid var(--line);
    border-radius: 20px; text-decoration: none; color: inherit;
    box-shadow: 0 2px 6px rgba(15,37,64,.04), 0 24px 50px -30px rgba(14,116,233,.28);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px);
    border-color: #C9DDF7;
    box-shadow: 0 6px 14px rgba(15,37,64,.07), 0 30px 60px -28px rgba(14,116,233,.38);
    outline: none;
  }
  .tile img, .tile svg { width: 96px; height: 96px; object-fit: contain; }
  .tile b { font-size: 15.5px; font-weight: 800; }
  .tile span { font-size: 12px; color: var(--sub); text-align: center; }

  /* Slow drifting colour fields behind everything — motion without distraction. */
  body::before, body::after {
    content:''; position:fixed; border-radius:50%; filter:blur(70px); opacity:.5;
    pointer-events:none; z-index:0;
  }
  body::before { width:52vmax; height:52vmax; left:-16vmax; top:-18vmax;
    background:radial-gradient(circle at 30% 30%, #BFD9FF, transparent 62%);
    animation: drift1 26s ease-in-out infinite alternate; }
  body::after { width:46vmax; height:46vmax; right:-14vmax; bottom:-16vmax;
    background:radial-gradient(circle at 60% 60%, #FFE6B8, transparent 62%);
    animation: drift2 32s ease-in-out infinite alternate; }
  @keyframes drift1 { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(7vmax,5vmax,0) scale(1.12); } }
  @keyframes drift2 { from { transform: translate3d(0,0,0) scale(1.08); } to { transform: translate3d(-6vmax,-4vmax,0) scale(1); } }

  h1, .sub, .tiles, footer { position: relative; z-index: 1; }

  /* Entrance: title, subtitle, then each tile in turn. */
  h1 { animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
  .sub { animation: rise .7s cubic-bezier(.2,.7,.3,1) .08s both; }
  .tile { animation: rise .75s cubic-bezier(.2,.7,.3,1) both; }
  .tile:nth-child(1) { animation-delay: .16s; }
  .tile:nth-child(2) { animation-delay: .26s; }
  .tile:nth-child(3) { animation-delay: .36s; }
  footer { animation: fade 1s ease .5s both; }
  @keyframes rise { from { opacity:0; transform: translateY(16px) scale(.985); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  /* Logos breathe gently; lifts on hover. */
  .tile img, .tile svg { animation: float 5.5s ease-in-out infinite; transition: transform .3s ease; }
  .tile:nth-child(2) img, .tile:nth-child(2) svg { animation-delay: -2.6s; }
  .tile:nth-child(3) img, .tile:nth-child(3) svg { animation-delay: -1.3s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .tile:hover img, .tile:hover svg { transform: scale(1.07) translateY(-4px); }

  /* ---------- the Olisa mark, animated a piece at a time ----------
     The logo is four separate shapes: the ring, two blue wave ribbons and the gold
     crescent. Each gets its own timeline, so the waves roll through the mark instead
     of the whole picture sliding about. The gold one runs counter to the blue pair,
     which is what makes it read as water rather than a wobble.
     transform-box: fill-box makes each shape turn about its own centre. */
  .ol-ring, .ol-w1, .ol-w2, .ol-w3 { transform-box: fill-box; transform-origin: 50% 50%; }
  .ol-ring { animation: ol-breath 4.2s ease-in-out infinite alternate; }
  .ol-w1   { animation: ol-roll 3.6s ease-in-out infinite; }
  .ol-w2   { animation: ol-roll 3.6s ease-in-out infinite; animation-delay: -.45s; }
  .ol-w3   { animation: ol-ebb  4.4s ease-in-out infinite; animation-delay: -.9s; }
  @keyframes ol-breath { from { transform: rotate(-1.2deg) scale(.988); }
                         to   { transform: rotate(1.2deg)  scale(1.012); } }
  @keyframes ol-roll { 0%, 100% { transform: translate(-9px, 3.5px) scaleY(.97); }
                       50%      { transform: translate(9px, -3.5px) scaleY(1.03); } }
  @keyframes ol-ebb  { 0%, 100% { transform: translate(6px, 2.5px) scaleY(1.02); }
                       50%      { transform: translate(-6px, -2.5px) scaleY(.98); } }

  /* ---------- the calculator mark, animated a piece at a time ----------
     The nine keys press in a scattered order so it reads as someone typing, the
     screen key blinks like a live total, and the whole unit breathes underneath. */
  .ca-all, .ca-scr, .ca-key { transform-box: fill-box; transform-origin: 50% 50%; }
  .ca-all { animation: ca-breath 4.6s ease-in-out infinite alternate; }
  .ca-scr { animation: ca-blink 2.6s ease-in-out infinite; }
  .ca-key { animation: ca-press 3s ease-in-out infinite; }
  .ca-key.k1 { animation-delay: 0s; }     .ca-key.k2 { animation-delay: -2.1s; }
  .ca-key.k3 { animation-delay: -.9s; }   .ca-key.k4 { animation-delay: -1.5s; }
  .ca-key.k5 { animation-delay: -.3s; }   .ca-key.k6 { animation-delay: -2.7s; }
  .ca-key.k7 { animation-delay: -1.2s; }  .ca-key.k8 { animation-delay: -.6s; }
  .ca-key.k9 { animation-delay: -1.8s; }
  @keyframes ca-breath { from { transform: rotate(-1.4deg) scale(.985); }
                         to   { transform: rotate(1.4deg)  scale(1.015); } }
  @keyframes ca-blink  { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes ca-press  { 0%, 70%, 100% { transform: none; }
                         8%  { transform: translateY(5px) scale(.92); }
                         22% { transform: none; } }

  /* ---------- the DC Bypass mark, animated a piece at a time ---------- */
  .dcb-logo .rl, .dcb-logo .lt, .dcb-logo .gp {
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .dcb-logo .rl { transform-origin: 100% 50%; animation: rl-sweep 2.6s ease-in-out infinite; }
  .dcb-logo .r1 { animation-delay: 0s; }
  .dcb-logo .r2 { animation-delay: -.28s; }
  .dcb-logo .r3 { animation-delay: -.56s; }
  @keyframes rl-sweep { 0%, 100% { transform: scaleX(.52) translateX(-3px); opacity: .32; }
                        52%      { transform: scaleX(1) translateX(0);      opacity: .95; } }
  .dcb-logo .lt { animation: lt-bob 2.7s ease-in-out infinite alternate; }
  .dcb-logo .l1 { animation-delay: 0s; }
  .dcb-logo .l2 { animation-delay: -.45s; }
  .dcb-logo .l3 { animation-delay: -.9s; }
  @keyframes lt-bob { from { transform: translateY(-2.1px) rotate(-1.7deg) scale(.985); }
                      to   { transform: translateY(2.1px)  rotate(1.7deg)  scale(1.015); } }
  .dcb-logo .gp { animation: gp-bob 2.4s ease-in-out infinite alternate; }
  .dcb-logo .c1 { animation-delay: 0s; }    .dcb-logo .c2 { animation-delay: -.17s; }
  .dcb-logo .c3 { animation-delay: -.34s; } .dcb-logo .c4 { animation-delay: -.51s; }
  .dcb-logo .c5 { animation-delay: -.68s; }
  @keyframes gp-bob { from { transform: translateY(-1.1px) rotate(-2.4deg); opacity: .72; }
                      to   { transform: translateY(1.1px)  rotate(2.4deg);  opacity: 1; } }


  /* Light sweeps across a tile on hover. */
  .tile { position: relative; overflow: hidden; }
  .tile::after {
    content:''; position:absolute; top:0; left:-70%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
    transform: skewX(-18deg); transition: left .65s ease; pointer-events:none;
  }
  .tile:hover::after { left:130%; }

  /* Anyone who prefers stillness gets stillness. */
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, .tile img, .tile svg { animation: none; }
    .tile svg * { animation: none !important; transform: none !important; opacity: 1 !important; }
    h1, .sub, .tile, footer { animation: none; }
    .tile::after { transition: none; }
  }
  footer { margin-top: 30px; font-size: 11.5px; color: var(--sub); text-align: center; }
</style>
</head>
